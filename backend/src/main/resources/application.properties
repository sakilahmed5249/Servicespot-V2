spring.application.name=Service-Spot
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/servicespot
spring.datasource.username=root
spring.datasource.password=//your database password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
logging.level.root=INFO
logging.level.Team.C.Service.Spot=DEBUG
logging.level.org.springframework.web=DEBUG

# JWT Configuration
jwt.secret=yourSecretKey123456789012345678901234567890
jwt.expiration=86400000


# ===============================
# EMAIL CONFIGURATION (Gmail SMTP)
# ===============================
# IMPORTANT: Change these credentials before deploying to production!
# Gmail App Password setup:
# 1. Go to: https://myaccount.google.com/security
# 2. Enable 2-Factor Authentication
# 3. Go to: https://myaccount.google.com/apppasswords
# 4. Create app password for "ServiceSpot"
# 5. Copy 16-character password (remove spaces)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your email id
spring.mail.password=your app password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender details
email.from.address=your email address
email.from.name=ServiceSpot Team

# Enable email (if disabled)
spring.mail.test-connection=false

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB